<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C6880"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#F7F3E8"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1C1608">MemoryVerse — architecture</text>
  <text x="30" y="60" font-size="12" fill="#6C6880">Every "Claude call" box is a live request to the Anthropic Messages API, asked to return structured JSON only.</text>

  <!-- lane labels -->
  <text x="30" y="130" font-size="11" font-weight="700" fill="#8A6D1E" letter-spacing="0.5">INGEST + ORGANIZE</text>
  <text x="30" y="360" font-size="11" font-weight="700" fill="#0F6E56" letter-spacing="0.5">RETRIEVE</text>

  <!-- Row 1: ingest -->
  <g>
    <rect x="30" y="145" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#D9D2BE" stroke-width="1.5"/>
    <text x="95" y="176" font-size="13" text-anchor="middle" fill="#1C1608">User pastes a document</text>
  </g>
  <line x1="160" y1="171" x2="205" y2="171" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="210" y="145" width="140" height="52" rx="8" fill="#FCEFD2" stroke="#D4A94B" stroke-width="1.5"/>
    <text x="280" y="167" font-size="12.5" text-anchor="middle" fill="#5C4715" font-weight="700">Classification call</text>
    <text x="280" y="183" font-size="11" text-anchor="middle" fill="#5C4715">Claude Sonnet 4.6</text>
  </g>
  <line x1="350" y1="171" x2="395" y2="171" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="400" y="145" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#D9D2BE" stroke-width="1.5"/>
    <text x="475" y="167" font-size="12.5" text-anchor="middle" fill="#1C1608" font-weight="700">Document store</text>
    <text x="475" y="183" font-size="11" text-anchor="middle" fill="#6C6880">category · skills · year · summary</text>
  </g>

  <!-- down to relationship + repository -->
  <line x1="475" y1="197" x2="475" y2="240" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="245" width="150" height="52" rx="8" fill="#FCEFD2" stroke="#D4A94B" stroke-width="1.5"/>
    <text x="405" y="267" font-size="12.5" text-anchor="middle" fill="#5C4715" font-weight="700">Relationship call</text>
    <text x="405" y="283" font-size="11" text-anchor="middle" fill="#5C4715">Claude Sonnet 4.6</text>
  </g>
  <line x1="475" y1="197" x2="640" y2="240" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="580" y="245" width="150" height="52" rx="8" fill="#DDF0EC" stroke="#5EC8C0" stroke-width="1.5"/>
    <text x="655" y="267" font-size="12.5" text-anchor="middle" fill="#0F6E56" font-weight="700">Repository view</text>
    <text x="655" y="283" font-size="11" text-anchor="middle" fill="#0F6E56">grouped by category</text>
  </g>

  <line x1="405" y1="297" x2="405" y2="330" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="290" y="335" width="230" height="55" rx="8" fill="#DDF0EC" stroke="#5EC8C0" stroke-width="1.5"/>
    <text x="405" y="357" font-size="12.5" text-anchor="middle" fill="#0F6E56" font-weight="700">Journey map</text>
    <text x="405" y="373" font-size="11" text-anchor="middle" fill="#0F6E56">time (x) × category (y) + relationship threads</text>
  </g>

  <!-- Row 3: search, lower lane -->
  <g>
    <rect x="30" y="430" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#D9D2BE" stroke-width="1.5"/>
    <text x="105" y="452" font-size="12.5" text-anchor="middle" fill="#1C1608" font-weight="700">Search UI</text>
    <text x="105" y="468" font-size="11" text-anchor="middle" fill="#6C6880">natural-language question</text>
  </g>
  <line x1="180" y1="456" x2="225" y2="456" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="230" y="430" width="150" height="52" rx="8" fill="#FCEFD2" stroke="#D4A94B" stroke-width="1.5"/>
    <text x="305" y="452" font-size="12.5" text-anchor="middle" fill="#5C4715" font-weight="700">Retrieval call</text>
    <text x="305" y="468" font-size="11" text-anchor="middle" fill="#5C4715">Claude Sonnet 4.6</text>
  </g>
  <line x1="380" y1="456" x2="425" y2="456" stroke="#6C6880" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="430" y="430" width="170" height="52" rx="8" fill="#DDF0EC" stroke="#5EC8C0" stroke-width="1.5"/>
    <text x="515" y="452" font-size="12.5" text-anchor="middle" fill="#0F6E56" font-weight="700">Search results</text>
    <text x="515" y="468" font-size="11" text-anchor="middle" fill="#0F6E56">answer + matching documents</text>
  </g>

  <!-- document store feeds both relationship and retrieval calls -->
  <path d="M 475 197 C 475 260, 340 380, 305 430" stroke="#6C6880" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="330" font-size="10.5" fill="#8B8699" font-style="italic">store feeds every downstream call</text>

  <!-- legend -->
  <g transform="translate(700,145)">
    <rect x="0" y="0" width="270" height="105" rx="8" fill="#FFFFFF" stroke="#D9D2BE"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1C1608">Legend</text>
    <rect x="14" y="34" width="16" height="16" rx="3" fill="#FCEFD2" stroke="#D4A94B"/>
    <text x="38" y="46" font-size="11.5" fill="#1C1608">Live Claude Sonnet 4.6 call</text>
    <rect x="14" y="58" width="16" height="16" rx="3" fill="#DDF0EC" stroke="#5EC8C0"/>
    <text x="38" y="70" font-size="11.5" fill="#1C1608">What the user sees</text>
    <rect x="14" y="82" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#D9D2BE"/>
    <text x="38" y="94" font-size="11.5" fill="#1C1608">UI / data</text>
  </g>

  <text x="700" y="300" font-size="12" fill="#1C1608" font-weight="700">Roadmap (post-hackathon)</text>
  <text x="700" y="320" font-size="11" fill="#6C6880">+ embeddings &amp; vector DB for retrieval at scale</text>
  <text x="700" y="337" font-size="11" fill="#6C6880">+ OCR ingestion for scanned PDFs / images</text>
  <text x="700" y="354" font-size="11" fill="#6C6880">+ persistent per-user document storage</text>

  <text x="30" y="600" font-size="10.5" fill="#8B8699">MemoryVerse AI '26 — architecture diagram</text>
</svg>
